server:
  port: ${SERVER_PORT:8081}

app:
  auth:
    username: ${APP_AUTH_USERNAME:demo}
    password: ${APP_AUTH_PASSWORD:change-me-local-only}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LTMy}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
