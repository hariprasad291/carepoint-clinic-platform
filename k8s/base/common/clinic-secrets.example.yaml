apiVersion: v1
kind: Secret
metadata:
  name: clinic-secrets
  namespace: clinic
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: clinic_app
  SPRING_DATASOURCE_PASSWORD: REPLACE_WITH_STRONG_CLINIC_APP_PASSWORD
  APP_SECURITY_JWT_SECRET: REPLACE_WITH_BASE64_ENCODED_32_BYTE_SECRET
  APP_AUTH_USERNAME: REPLACE_WITH_DEMO_USERNAME
  APP_AUTH_PASSWORD: REPLACE_WITH_DEMO_PASSWORD
  POSTGRES_DB: clinic
  POSTGRES_USER: clinic_admin
  POSTGRES_PASSWORD: REPLACE_WITH_STRONG_POSTGRES_ADMIN_PASSWORD
  CLINIC_APP_PASSWORD: REPLACE_WITH_STRONG_CLINIC_APP_PASSWORD
