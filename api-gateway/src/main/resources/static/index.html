<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carepoint Clinic</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172b4d; background: #f3f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: #123b5d; color: white; padding: 1.2rem max(1.5rem, calc((100% - 1050px) / 2)); }
    header strong { font-size: 1.2rem; letter-spacing: .02em; }
    main { max-width: 1050px; margin: 3rem auto; padding: 0 1.25rem; }
    .card { background: white; border: 1px solid #dce6ef; border-radius: 14px; padding: 1.5rem; box-shadow: 0 8px 28px #193b5510; }
    #login { max-width: 420px; margin: 8vh auto; }
    h1 { margin-top: 0; font-size: 1.7rem; }
    p { color: #5b6f82; line-height: 1.55; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; font-size: .9rem; }
    input { width: 100%; border: 1px solid #c8d5e1; border-radius: 8px; padding: .75rem; font: inherit; }
    button { background: #087e8b; border: 0; border-radius: 8px; color: white; padding: .75rem 1rem; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #066c77; }
    form button { width: 100%; margin-top: 1.25rem; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .toolbar h1 { margin: 0; }
    .message { min-height: 1.3rem; color: #a32b35; font-size: .9rem; }
    .hint { font-size: .85rem; }
    .record { border-top: 1px solid #e4ebf1; padding: .8rem 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><strong>Carepoint <span style="font-weight:400">Clinic</span></strong></header>
  <main>
    <section id="login" class="card">
      <h1>Welcome back</h1>
      <p>Sign in to manage patients and appointments.</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required value="demo">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
      <p class="hint">Local demo credentials: <code>demo</code> / <code>change-me-local-only</code></p>
      <p id="login-message" class="message" role="alert"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="toolbar">
        <div><h1>Clinic dashboard</h1><p>Patients and upcoming appointments</p></div>
        <button id="logout" type="button">Sign out</button>
      </div>
      <div class="row">
        <section class="card">
          <h2>Add patient</h2>
          <form id="patient-form">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" maxlength="120" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" maxlength="254" required>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" maxlength="32">
            <button type="submit">Save patient</button>
          </form>
          <p id="patient-message" class="message" role="status"></p>
        </section>
        <section class="card">
          <h2>Patients</h2>
          <div id="patients"></div>
        </section>
      </div>
      <section class="card" style="margin-top:1rem">
        <h2>Appointments</h2>
        <form id="appointment-form" class="row">
          <div><label for="patientId">Patient</label><select id="patientId" required style="width:100%;padding:.75rem;border:1px solid #c8d5e1;border-radius:8px;font:inherit"></select></div>
          <div><label for="reason">Reason</label><input id="reason" maxlength="240" required></div>
          <div><label for="scheduledAt">Date and time</label><input id="scheduledAt" type="datetime-local" required></div>
          <div style="align-self:end"><button type="submit">Schedule</button></div>
        </form>
        <p id="appointment-message" class="message" role="status"></p>
        <div id="appointments"></div>
      </section>
    </section>
  </main>
  <script>
    const loginSection = document.querySelector("#login");
    const dashboard = document.querySelector("#dashboard");
    const tokenKey = "carepoint-token";
    const token = () => sessionStorage.getItem(tokenKey);
    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(token() ? { Authorization: `Bearer ${token()}` } : {}), ...options.headers }
      });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.detail || `Request failed (${response.status})`);
      }
      return response.status === 204 ? null : response.json();
    }
    async function refresh() {
      const [patients, appointments] = await Promise.all([
        api("/api/clinic/patients"), api("/api/clinic/appointments")
      ]);
      document.querySelector("#patients").replaceChildren();
      const patientSelect = document.querySelector("#patientId");
      patientSelect.replaceChildren(new Option("Choose a patient", ""));
      patients.forEach(patient => {
        const entry = document.createElement("div");
        entry.className = "record";
        entry.textContent = `${patient.fullName} · ${patient.email}`;
        document.querySelector("#patients").append(entry);
        patientSelect.add(new Option(patient.fullName, patient.id));
      });
      document.querySelector("#appointments").replaceChildren();
      appointments.forEach(appointment => {
        const entry = document.createElement("div");
        entry.className = "record";
        const patient = patients.find(item => item.id === appointment.patientId);
        entry.textContent = `${new Date(appointment.scheduledAt).toLocaleString()} · ${patient?.fullName || "Patient"} · ${appointment.reason} · ${appointment.status}`;
        document.querySelector("#appointments").append(entry);
      });
    }
    function showDashboard() {
      loginSection.hidden = true;
      dashboard.hidden = false;
      refresh().catch(error => { document.querySelector("#patient-message").textContent = error.message; });
    }
    document.querySelector("#login-form").addEventListener("submit", async event => {
      event.preventDefault();
      const message = document.querySelector("#login-message");
      message.textContent = "";
      try {
        const result = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: document.querySelector("#username").value,
            password: document.querySelector("#password").value
          })
        });
        sessionStorage.setItem(tokenKey, result.accessToken);
        showDashboard();
      } catch (error) { message.textContent = error.message; }
    });
    document.querySelector("#patient-form").addEventListener("submit", async event => {
      event.preventDefault();
      const message = document.querySelector("#patient-message");
      try {
        await api("/api/clinic/patients", {
          method: "POST",
          body: JSON.stringify({
            fullName: document.querySelector("#fullName").value,
            email: document.querySelector("#email").value,
            phone: document.querySelector("#phone").value || null
          })
        });
        event.target.reset();
        message.textContent = "Patient saved.";
        await refresh();
      } catch (error) { message.textContent = error.message; }
    });
    document.querySelector("#appointment-form").addEventListener("submit", async event => {
      event.preventDefault();
      const message = document.querySelector("#appointment-message");
      try {
        await api("/api/clinic/appointments", {
          method: "POST",
          body: JSON.stringify({
            patientId: document.querySelector("#patientId").value,
            reason: document.querySelector("#reason").value,
            scheduledAt: new Date(document.querySelector("#scheduledAt").value).toISOString()
          })
        });
        event.target.reset();
        message.textContent = "Appointment scheduled.";
        await refresh();
      } catch (error) { message.textContent = error.message; }
    });
    document.querySelector("#logout").addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      dashboard.hidden = true;
      loginSection.hidden = false;
    });
    if (token()) showDashboard();
  </script>
</body>
</html>
